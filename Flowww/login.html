<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <header class="bg-[#0f2b5b] text-white py-4">
    <div class="max-w-md mx-auto px-4">
      <a href="index.html" class="flex items-center gap-2 hover:opacity-80">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shrink-0">
          <svg viewBox="0 0 24 24" class="w-4 h-4 text-white" fill="currentColor"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7V3z"/></svg>
        </div>
        <span class="font-semibold">Flow</span>
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Entrar</h1>
        <p class="text-gray-500 mt-1">Acesse sua conta Flow</p>
      </div>

      <div class="flex bg-gray-100 rounded-xl p-1 mb-6">
        <button type="button" id="tab-paciente" onclick="trocarTipo('paciente')" class="flex-1 py-2.5 rounded-lg text-sm font-medium bg-blue-600 text-white">Paciente</button>
        <button type="button" id="tab-profissional" onclick="trocarTipo('profissional')" class="flex-1 py-2.5 rounded-lg text-sm font-medium text-gray-600">Profissional</button>
      </div>

      <form id="form-paciente" onsubmit="entrarPaciente(event)" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
          <input type="email" id="p-email" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50" placeholder="seu@email.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
          <input type="password" id="p-senha" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50">
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl">Entrar como paciente</button>
      </form>

      <form id="form-profissional" onsubmit="entrarProfissional(event)" class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">CRM</label>
          <input type="text" id="pr-crm" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50" placeholder="CRM/SP 123456">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
          <input type="email" id="pr-email" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50" placeholder="seu@email.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
          <input type="password" id="pr-senha" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50">
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl">Entrar como profissional</button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Não tem conta? <a href="cadastro.html" class="text-blue-600 font-medium">Criar conta</a>
      </p>
      <p class="text-center text-xs text-gray-400 mt-4">
        <a href="index.html" class="underline">← Voltar para a página inicial</a>
      </p>
    </div>
  </main>

  <script>
    function trocarTipo(tipo) {
      var formPac = document.getElementById('form-paciente');
      var formPro = document.getElementById('form-profissional');
      var tabPac = document.getElementById('tab-paciente');
      var tabPro = document.getElementById('tab-profissional');
      if (tipo === 'paciente') {
        formPac.classList.remove('hidden'); formPro.classList.add('hidden');
        tabPac.className = 'flex-1 py-2.5 rounded-lg text-sm font-medium bg-blue-600 text-white';
        tabPro.className = 'flex-1 py-2.5 rounded-lg text-sm font-medium text-gray-600';
      } else {
        formPro.classList.remove('hidden'); formPac.classList.add('hidden');
        tabPro.className = 'flex-1 py-2.5 rounded-lg text-sm font-medium bg-blue-600 text-white';
        tabPac.className = 'flex-1 py-2.5 rounded-lg text-sm font-medium text-gray-600';
      }
    }
    function entrarPaciente(e) {
      e.preventDefault();
      var email = document.getElementById('p-email').value.trim();
      var senha = document.getElementById('p-senha').value;
      var usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
      var user = usuarios.find(function(u){ return u.tipo === 'paciente' && u.email === email && u.senha === senha; });
      if (!user) { alert('E-mail ou senha incorretos (paciente).'); return; }
      localStorage.setItem('usuarioLogado', JSON.stringify(user));
      window.location.href = 'paciente/exames.html';
    }
    function entrarProfissional(e) {
      e.preventDefault();
      var crm = document.getElementById('pr-crm').value.trim();
      var email = document.getElementById('pr-email').value.trim();
      var senha = document.getElementById('pr-senha').value;
      var usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
      var user = usuarios.find(function(u){
        return u.tipo === 'profissional' && u.email === email && u.senha === senha && (u.crm || '').toLowerCase() === crm.toLowerCase();
      });
      if (!user) { alert('CRM, e-mail ou senha incorretos (profissional).'); return; }
      localStorage.setItem('usuarioLogado', JSON.stringify(user));
      window.location.href = 'profissional/agenda.html';
    }
  </script>
</body>
</html>
