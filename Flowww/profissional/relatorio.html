<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório - Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-[#0f2b5b] text-white flex flex-col">
      <div class="p-5 border-b border-white/10">
        <div class="flex items-center gap-2 mb-6">
          <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" class="w-5 h-5 text-white" fill="currentColor"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7V3z"/></svg>
          </div>
          <span class="font-semibold">Flow</span>
        </div>
        <div class="relative">
          <button type="button" onclick="toggleMenuUsuario()" class="flex items-center gap-3 w-full text-left hover:bg-white/10 rounded-xl p-1 -m-1">
            <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center font-bold text-sm overflow-hidden shrink-0" id="avatar-box">
              <span id="iniciais">DM</span>
              <img id="foto-usuario" class="hidden w-full h-full object-cover" alt="">
            </div>
            <div class="min-w-0">
              <p class="font-medium text-sm truncate" id="nome-usuario">Dr.</p>
              <p class="text-blue-200 text-xs" id="crm-usuario">CRM</p>
            </div>
          </button>
          <div id="menu-usuario" class="hidden absolute left-0 right-0 top-full mt-2 bg-white text-gray-800 rounded-xl shadow-xl border z-50 overflow-hidden">
            <label class="flex items-center gap-2 px-4 py-3 text-sm hover:bg-gray-50 cursor-pointer border-b">
              <span>📷 Alterar foto</span>
              <input type="file" accept="image/*" class="hidden" onchange="trocarFoto(this)">
            </label>
            <button type="button" onclick="excluirConta()" class="w-full text-left px-4 py-3 text-sm text-red-600 hover:bg-red-50">🗑️ Excluir conta</button>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-4 space-y-1 text-sm">
        <a href="agenda.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-blue-100 hover:bg-white/10">Agenda</a>
        <a href="buscar.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-blue-100 hover:bg-white/10">Buscar Paciente</a>
        <a href="relatorio.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-blue-600 text-white">Relatório</a>
        <a href="prescrever.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-blue-100 hover:bg-white/10">Prescrever</a>
        <a href="mensagens.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-blue-100 hover:bg-white/10">Mensagens</a>
        <a href="disponibilidade.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-blue-100 hover:bg-white/10">Disponibilidade</a>
      </nav>
      <div class="p-4 border-t border-white/10"><button onclick="sair()" class="text-blue-200 hover:text-white text-sm">Sair</button></div>
    </aside>
    <main class="flex-1 p-8">
      <h1 class="text-2xl font-bold mb-6">Relatório</h1>
      <div id="card-pac" class="bg-white rounded-2xl border p-4 mb-4 max-w-xl hidden">
        <p class="text-xs text-gray-500 mb-1">PACIENTE</p>
        <p class="font-medium" id="pac-nome"></p>
      </div>
      <div id="aviso" class="bg-yellow-50 border border-yellow-200 text-yellow-800 rounded-xl p-4 mb-4 max-w-xl text-sm">
        <a href="buscar.html" class="underline font-medium">Buscar paciente primeiro</a>
      </div>
      <form onsubmit="salvar(event)" class="bg-white rounded-2xl border p-6 max-w-xl space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Especialidade</label>
          <input id="esp" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50" placeholder="Ex: Clínica Geral">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Diagnóstico</label>
          <textarea id="diag" required rows="3" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50" placeholder="Descreva o diagnóstico..."></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Observações adicionais</label>
          <textarea id="obs" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50" placeholder="Recomendações..."></textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium">+ Salvar relatório</button>
      </form>
      <h2 class="font-semibold mt-8 mb-3 max-w-xl">Relatórios deste paciente</h2>
      <div id="lista-relatorios" class="space-y-2 max-w-xl"></div>
    </main>
  </div>
  <script>
    const user = JSON.parse(localStorage.getItem('usuarioLogado') || 'null');
    if (!user || user.tipo !== 'profissional') window.location.href = '../login.html';
    else {
      document.getElementById('nome-usuario').textContent = user.nome;
      document.getElementById('crm-usuario').textContent = user.crm || '';
      const n = user.nome.split(' ');
      document.getElementById('iniciais').textContent = (n[0][0] + (n[1]?n[1][0]:'')).toUpperCase();
      if (user.foto) {
        document.getElementById('foto-usuario').src = user.foto;
        document.getElementById('foto-usuario').classList.remove('hidden');
        document.getElementById('iniciais').classList.add('hidden');
      }
    }
    const pac = JSON.parse(localStorage.getItem('pacienteSelecionado') || 'null');
    if (pac) {
      document.getElementById('card-pac').classList.remove('hidden');
      document.getElementById('aviso').classList.add('hidden');
      document.getElementById('pac-nome').textContent = pac.nome;
    }
    function salvar(e) {
      e.preventDefault();
      if (!pac) { alert('Selecione um paciente primeiro.'); return; }
      const r = {
        id: Date.now().toString(), pacienteId: pac.id, medico: user.nome,
        especialidade: document.getElementById('esp').value.trim(),
        diagnostico: document.getElementById('diag').value.trim(),
        observacoes: document.getElementById('obs').value.trim(),
        hospital: user.hospital || '—', data: new Date().toLocaleDateString('pt-BR')
      };
      const lista = JSON.parse(localStorage.getItem('historico_' + pac.id) || '[]');
      lista.unshift(r);
      localStorage.setItem('historico_' + pac.id, JSON.stringify(lista));
      const notif = JSON.parse(localStorage.getItem('notif_' + pac.id) || '{}');
      notif.historico = (notif.historico || 0) + 1;
      localStorage.setItem('notif_' + pac.id, JSON.stringify(notif));
      alert('Relatório salvo! O paciente verá a bolinha vermelha no Histórico.');
      e.target.reset();
      carregarRelatorios();
    }
    function carregarRelatorios() {
      if (!pac) { document.getElementById('lista-relatorios').innerHTML = ''; return; }
      var lista = JSON.parse(localStorage.getItem('historico_' + pac.id) || '[]');
      var div = document.getElementById('lista-relatorios');
      if (!lista.length) { div.innerHTML = '<p class="text-sm text-gray-400">Nenhum relatório ainda.</p>'; return; }
      div.innerHTML = lista.map(function(r, i) {
        return '<div class="bg-white rounded-xl border p-4 flex justify-between items-start gap-2">'+
          '<div><p class="font-medium text-sm">'+(r.especialidade||'')+'</p><p class="text-xs text-gray-600">'+(r.diagnostico||'')+'</p><p class="text-xs text-gray-400">'+r.data+' · '+(r.medico||'')+'</p></div>'+
          '<div class="flex gap-2 shrink-0">'+
          '<button type="button" onclick="editarRel('+i+')" class="text-xs text-blue-600 hover:underline">Editar</button>'+
          '<button type="button" onclick="excluirRel('+i+')" class="text-xs text-red-600 hover:underline">Excluir</button></div></div>';
      }).join('');
    }
    function excluirRel(i) {
      if (!confirm('Excluir este relatório?')) return;
      var lista = JSON.parse(localStorage.getItem('historico_' + pac.id) || '[]');
      lista.splice(i, 1);
      localStorage.setItem('historico_' + pac.id, JSON.stringify(lista));
      carregarRelatorios();
    }
    function editarRel(i) {
      var lista = JSON.parse(localStorage.getItem('historico_' + pac.id) || '[]');
      var r = lista[i];
      var esp = prompt('Especialidade:', r.especialidade || ''); if (esp === null) return;
      var diag = prompt('Diagnóstico:', r.diagnostico || ''); if (diag === null) return;
      var obs = prompt('Observações:', r.observacoes || ''); if (obs === null) return;
      lista[i].especialidade = esp.trim() || r.especialidade;
      lista[i].diagnostico = diag.trim() || r.diagnostico;
      lista[i].observacoes = obs.trim();
      localStorage.setItem('historico_' + pac.id, JSON.stringify(lista));
      carregarRelatorios();
      alert('Atualizado!');
    }
    carregarRelatorios();
    function toggleMenuUsuario(){ document.getElementById('menu-usuario').classList.toggle('hidden'); }
    document.addEventListener('click', function(e){ const m=document.getElementById('menu-usuario'); if(m&&!e.target.closest('.relative')) m.classList.add('hidden'); });
    function trocarFoto(input){
      const file=input.files[0]; if(!file)return;
      if(!file.type.startsWith('image/')){alert('Selecione uma imagem.');return;}
      if(file.size>2*1024*1024){alert('Máximo 2 MB.');return;}
      const reader=new FileReader();
      reader.onload=function(e){
        const foto=e.target.result; user.foto=foto;
        localStorage.setItem('usuarioLogado',JSON.stringify(user));
        const usuarios=JSON.parse(localStorage.getItem('usuarios')||'[]');
        const i=usuarios.findIndex(function(u){return u.id===user.id;});
        if(i>=0){usuarios[i].foto=foto;localStorage.setItem('usuarios',JSON.stringify(usuarios));}
        document.getElementById('foto-usuario').src=foto;
        document.getElementById('foto-usuario').classList.remove('hidden');
        document.getElementById('iniciais').classList.add('hidden');
        document.getElementById('menu-usuario').classList.add('hidden');
        alert('Foto atualizada!');
      };
      reader.readAsDataURL(file);
    }
    function excluirConta(){
      if(!confirm('Excluir sua conta? Não dá para desfazer.'))return;
      if(!confirm('Confirma a exclusão definitiva?'))return;
      const id=user.id;
      localStorage.setItem('usuarios',JSON.stringify(JSON.parse(localStorage.getItem('usuarios')||'[]').filter(function(u){return u.id!==id;})));
      localStorage.removeItem('usuarioLogado');
      alert('Conta excluída.'); window.location.href='../index.html';
    }
    function sair(){ localStorage.removeItem('usuarioLogado'); window.location.href='../index.html'; }
  </script>
</body>
</html>
