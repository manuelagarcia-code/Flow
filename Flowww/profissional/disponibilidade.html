<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disponibilidade - Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-[#0f2b5b] text-white flex flex-col">
      <div class="p-5 border-b border-white/10">
        <div class="flex items-center gap-2 mb-6">
          <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shrink-0">
            <svg viewBox="0 0 24 24" class="w-5 h-5 text-white" fill="currentColor"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7V3z"/></svg>
          </div>
          <span class="font-semibold">Flow</span>
        </div>
        <div class="relative">
          <button type="button" onclick="toggleMenuUsuario()" class="flex items-center gap-3 w-full text-left hover:bg-white/10 rounded-xl p-1 -m-1">
            <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center font-bold text-sm overflow-hidden shrink-0" id="avatar-box">
              <span id="iniciais">DM</span>
              <img id="foto-usuario" class="hidden w-full h-full object-cover" alt="">
            </div>
            <div class="min-w-0">
              <p class="font-medium text-sm truncate" id="nome-usuario">Dr.</p>
              <p class="text-blue-200 text-xs" id="crm-usuario">CRM</p>
            </div>
          </button>
          <div id="menu-usuario" class="hidden absolute left-0 right-0 top-full mt-2 bg-white text-gray-800 rounded-xl shadow-xl border z-50 overflow-hidden">
            <label class="flex items-center gap-2 px-4 py-3 text-sm hover:bg-gray-50 cursor-pointer border-b">
              <span>📷 Alterar foto</span>
              <input type="file" accept="image/*" class="hidden" onchange="trocarFoto(this)">
            </label>
            <button type="button" onclick="excluirConta()" class="w-full text-left px-4 py-3 text-sm text-red-600 hover:bg-red-50">🗑️ Excluir conta</button>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-4 space-y-1 text-sm">
        <a href="agenda.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-blue-100 hover:bg-white/10">Agenda</a>
        <a href="buscar.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-blue-100 hover:bg-white/10">Buscar Paciente</a>
        <a href="relatorio.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-blue-100 hover:bg-white/10">Relatório</a>
        <a href="prescrever.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-blue-100 hover:bg-white/10">Prescrever</a>
        <a href="mensagens.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-blue-100 hover:bg-white/10">Mensagens</a>
        <a href="disponibilidade.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-blue-600 text-white">Disponibilidade</a>
      </nav>
      <div class="p-4 border-t border-white/10"><button onclick="sair()" class="text-blue-200 hover:text-white text-sm">Sair</button></div>
    </aside>
    <main class="flex-1 p-8">
      <h1 class="text-2xl font-bold mb-2">Disponibilidade</h1>
      <p class="text-gray-500 text-sm mb-6 max-w-xl">Marque vários horários de uma vez. Os pacientes verão essas opções ao agendar.</p>
      <div class="bg-white rounded-2xl border p-6 max-w-xl space-y-4 mb-6">
        <div>
          <label class="block text-sm font-medium mb-1">Especialidade</label>
          <select id="especialidade" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50">
            <option>Clínica Geral</option>
            <option>Cardiologia</option>
            <option>Dermatologia</option>
            <option>Gastroenterologia</option>
            <option>Pediatria</option>
            <option>Ortopedia</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Data</label>
          <input type="date" id="data" class="w-full px-4 py-2.5 rounded-xl border border-gray-200">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Horários (marque vários)</label>
          <div class="grid grid-cols-4 gap-2" id="grid-horas"></div>
        </div>
        <button onclick="adicionar()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium">+ Adicionar horários selecionados</button>
      </div>
      <h2 class="font-semibold mb-3">Meus horários cadastrados</h2>
      <div id="lista" class="space-y-2 max-w-xl"></div>
    </main>
  </div>
  <script>
    const user = JSON.parse(localStorage.getItem('usuarioLogado') || 'null');
    if (!user || user.tipo !== 'profissional') window.location.href = '../login.html';
    else {
      document.getElementById('nome-usuario').textContent = user.nome;
      document.getElementById('crm-usuario').textContent = user.crm || '';
      const n = user.nome.split(' ');
      document.getElementById('iniciais').textContent = (n[0][0] + (n[1]?n[1][0]:'')).toUpperCase();
      if (user.foto) {
        document.getElementById('foto-usuario').src = user.foto;
        document.getElementById('foto-usuario').classList.remove('hidden');
        document.getElementById('iniciais').classList.add('hidden');
      }
    }
    const horas = ['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30'];
    document.getElementById('grid-horas').innerHTML = horas.map(function(h){
      return '<label class="flex items-center gap-1.5 px-2 py-2 border rounded-lg cursor-pointer hover:border-blue-400 text-sm"><input type="checkbox" value="'+h+'" class="hora-check accent-blue-600"> '+h+'</label>';
    }).join('');
    document.getElementById('data').setAttribute('min', new Date().toISOString().split('T')[0]);

    function getSlots(){ return JSON.parse(localStorage.getItem('disponibilidade_'+user.id)||'[]'); }
    function saveSlots(s){
      localStorage.setItem('disponibilidade_'+user.id, JSON.stringify(s));
      const all = JSON.parse(localStorage.getItem('disponibilidades_global')||'{}');
      all[user.id] = {
        profId: user.id,
        nome: user.nome,
        crm: user.crm,
        hospital: user.hospital || (Array.isArray(user.hospitais) ? user.hospitais.join(', ') : '') || '',
        especialidade: document.getElementById('especialidade').value,
        slots: s
      };
      localStorage.setItem('disponibilidades_global', JSON.stringify(all));
    }
    function adicionar(){
      const data = document.getElementById('data').value;
      if (!data){ alert('Selecione uma data.'); return; }
      const selecionados = [].slice.call(document.querySelectorAll('.hora-check:checked')).map(function(c){ return c.value; });
      if (!selecionados.length){ alert('Marque pelo menos um horário.'); return; }
      const slots = getSlots();
      const esp = document.getElementById('especialidade').value;
      selecionados.forEach(function(hora){
        if (!slots.find(function(s){ return s.data===data && s.hora===hora; })) {
          slots.push({ id: Date.now()+Math.random(), data:data, hora:hora, especialidade:esp });
        }
      });
      slots.sort(function(a,b){ return (a.data+a.hora).localeCompare(b.data+b.hora); });
      saveSlots(slots);
      document.querySelectorAll('.hora-check').forEach(function(c){ c.checked=false; });
      render();
      alert(selecionados.length+' horário(s) adicionado(s)!');
    }
    function remover(id){
      saveSlots(getSlots().filter(function(s){ return String(s.id)!==String(id); }));
      render();
    }
    function render(){
      const slots = getSlots();
      const div = document.getElementById('lista');
      if (!slots.length){ div.innerHTML='<p class="text-sm text-gray-400">Nenhum horário cadastrado ainda.</p>'; return; }
      const porData = {};
      slots.forEach(function(s){ if(!porData[s.data]) porData[s.data]=[]; porData[s.data].push(s); });
      div.innerHTML = Object.keys(porData).sort().map(function(data){
        const d = data.split('-').reverse().join('/');
        return '<div class="bg-white rounded-xl border p-4"><p class="font-medium text-sm mb-2">'+d+' <span class="text-gray-400 font-normal">· '+(porData[data][0].especialidade||'')+'</span></p>'+
          '<div class="flex flex-wrap gap-2">'+porData[data].map(function(s){
            return '<span class="inline-flex items-center gap-1 px-3 py-1 bg-blue-50 text-blue-700 rounded-full text-sm">'+s.hora+
              ' <button onclick="remover(\''+s.id+'\')" class="text-red-500 hover:text-red-700 ml-1 text-xs">✕</button></span>';
          }).join('')+'</div></div>';
      }).join('');
    }
    function toggleMenuUsuario(){ document.getElementById('menu-usuario').classList.toggle('hidden'); }
    document.addEventListener('click', function(e){ const m=document.getElementById('menu-usuario'); if(m&&!e.target.closest('.relative')) m.classList.add('hidden'); });
    function trocarFoto(input){
      const file=input.files[0]; if(!file)return;
      if(!file.type.startsWith('image/')){alert('Selecione uma imagem.');return;}
      if(file.size>2*1024*1024){alert('Máximo 2 MB.');return;}
      const reader=new FileReader();
      reader.onload=function(e){
        const foto=e.target.result; user.foto=foto;
        localStorage.setItem('usuarioLogado',JSON.stringify(user));
        const usuarios=JSON.parse(localStorage.getItem('usuarios')||'[]');
        const i=usuarios.findIndex(function(u){return u.id===user.id;});
        if(i>=0){usuarios[i].foto=foto;localStorage.setItem('usuarios',JSON.stringify(usuarios));}
        document.getElementById('foto-usuario').src=foto;
        document.getElementById('foto-usuario').classList.remove('hidden');
        document.getElementById('iniciais').classList.add('hidden');
        document.getElementById('menu-usuario').classList.add('hidden');
        alert('Foto atualizada!');
      };
      reader.readAsDataURL(file);
    }
    function excluirConta(){
      if(!confirm('Excluir sua conta? Não dá para desfazer.'))return;
      if(!confirm('Confirma a exclusão definitiva?'))return;
      const id=user.id;
      localStorage.setItem('usuarios',JSON.stringify(JSON.parse(localStorage.getItem('usuarios')||'[]').filter(function(u){return u.id!==id;})));
      localStorage.removeItem('usuarioLogado');
      localStorage.removeItem('disponibilidade_'+id);
      alert('Conta excluída.'); window.location.href='../index.html';
    }
    function sair(){ localStorage.removeItem('usuarioLogado'); window.location.href='../index.html'; }
    render();
  </script>
</body>
</html>
